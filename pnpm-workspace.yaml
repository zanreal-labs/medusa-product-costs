# pnpm 11 refuses to run a dependency's build scripts unless it is listed here.
# These are the native builds a Medusa install performs anyway, and pnpm treats
# them as an error rather than a warning once this file exists.
#
# admin-kit needed an entry here only while it was git-hosted, because pnpm had
# to run its `prepare` to build .medusa/server. The registry tarball ships that
# directory already built and `prepare` does not run for a registry dependency,
# so no entry is needed.
allowBuilds:
  "@medusajs/telemetry": true
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
# pnpm 11 defaults minimumReleaseAge to 1440 minutes: it refuses to install a
# version published less than 24 hours ago, because a malicious release is
# usually pulled from the registry within the hour. Each admin-kit version
# listed here was published minutes before this lockfile was written, so pnpm
# added the exclusion itself - without it `pnpm install --frozen-lockfile`
# fails on CI.
#
# Each entry stops being load-bearing 24 hours after that version was
# published, and the whole list can go once the newest one is past its
# cooldown. Versions are listed exactly, so an admin-kit release that is NOT
# named here is still held for the full 24 hours.
minimumReleaseAgeExclude:
  - '@zanreal/medusa-admin-kit@0.1.0 || 0.2.0'
