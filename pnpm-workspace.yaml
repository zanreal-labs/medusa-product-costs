# pnpm 11 refuses to run a dependency's build scripts unless it is listed here.
# These are the native builds a Medusa install performs anyway, and pnpm treats
# them as an error rather than a warning once this file exists.
#
# admin-kit needed an entry here only while it was git-hosted, because pnpm had
# to run its `prepare` to build .medusa/server. The registry tarball ships that
# directory already built and `prepare` does not run for a registry dependency,
# so no entry is needed.
allowBuilds:
  "@medusajs/telemetry": true
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
