name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # @zanreal/medusa-admin-kit is declared as `github:zanreal-labs/...`, which
      # pnpm resolves to the SSH form `git@github.com:`. The runner has no SSH
      # key, so the clone failed with "Permission denied (publickey)" and every
      # job died here. The repository is public, so an anonymous HTTPS clone
      # works and needs no credential - which also keeps the build reproducible
      # for anyone outside the organisation.
      - name: Clone git dependencies over HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec medusa lint src

      - name: Typecheck (backend)
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Typecheck (admin)
        run: pnpm exec tsc --noEmit -p src/admin/tsconfig.json

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
